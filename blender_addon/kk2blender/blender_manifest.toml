schema_version = "1.0.0"

id = "kk2blender"
version = "0.1.5"
name = "KK2Blender"
tagline = "Import Koikatsu CharaStudio scenes with their animation, camera and lights"
maintainer = "Juwan-Hwang"
type = "add-on"
website = "https://github.com/Juwan-Hwang/KK2Blender"
tags = ["Import-Export", "Animation"]
blender_version_min = "5.2.0"
license = ["SPDX:MIT"]

# Pillow for KKBP (it needs Pillow before it imports characters); Blender installs the wheel for this platform.
wheels = [
  "./wheels/pillow-12.3.0-cp313-cp313-win_amd64.whl",
  "./wheels/pillow-12.3.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/pillow-12.3.0-cp313-cp313-macosx_11_0_arm64.whl",
]

[permissions]
files = "Reads exported scenes and writes renders"
